<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP-SDK 示例 1: 表单提交与弹窗关闭</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .init-data {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #495057;
        }

        .init-data pre {
            margin: 8px 0 0 0;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📝 表单提交示例</h1>
        <p class="subtitle">演示如何使用 CDP-SDK 提交表单并关闭弹窗</p>

        <!-- 显示初始化数据 -->
        <div class="init-data" id="initDataDisplay" style="display: none;">
            <strong>📦 接收到的初始化数据:</strong>
            <pre id="initDataContent"></pre>
        </div>

        <!-- 表单 -->
        <form id="userForm">
            <div class="form-group">
                <label for="userName">姓名 *</label>
                <input type="text" id="userName" name="userName" required placeholder="请输入姓名">
            </div>

            <div class="form-group">
                <label for="userEmail">邮箱 *</label>
                <input type="email" id="userEmail" name="userEmail" required placeholder="请输入邮箱">
            </div>

            <div class="form-group">
                <label for="userPhone">手机号</label>
                <input type="tel" id="userPhone" name="userPhone" placeholder="请输入手机号">
            </div>

            <div class="form-group">
                <label for="userRemark">备注</label>
                <textarea id="userRemark" name="userRemark" placeholder="请输入备注信息"></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">✓ 提交</button>
                <button type="button" class="btn-secondary" onclick="handleCancel()">✕ 取消</button>
            </div>
        </form>

        <!-- 状态提示 -->
        <div class="status" id="statusMessage"></div>
    </div>

    <!-- 
        ==========================================
        第一步: SDK 引入
        ==========================================
        注意: 如果此页面是通过 ExternalPage 组件(面板网页)嵌入的,
        CDP 会自动注入 SDK,无需手动引入下面的 script 标签。
        
        如果是其他外部链接嵌入的页面,需要手动引入:
    -->
    <!-- <script src="https://kwaidoo.com/cdn_cdp/sdk/cdp_sdk/cdp-sdk-1.4.1.min.js"></script> -->

    <script>
        // ==========================================
        // 第二步: 检查 SDK 是否可用
        // ==========================================
        function checkSDK() {
            if (window.semApp && window.semApp.cdpSdk) {
                console.log('✅ CDP-SDK 已加载');
                showStatus('CDP-SDK 已就绪', 'success');
                return true;
            } else {
                console.error('❌ CDP-SDK 未加载');
                showStatus('CDP-SDK 未加载,请检查环境', 'error');
                return false;
            }
        }

        // ==========================================
        // 第三步: 获取初始化数据，填充表单
        // ==========================================
        // 注意:
        // 1. 初始化数据仅在通过弹窗指令(ui.modal.open)打开当前页面时传入
        // 2. 数据来源于打开弹窗时传递的 data 参数
        // 3. 更多细节请查阅 CDP-SDK 使用指南
        function loadInitData() {
            if (!checkSDK()) return;

            try {
                const initData = window.semApp.cdpSdk.getInitData();
                console.log('📦 初始化数据:', initData);

                // 如果有初始化数据,显示出来
                if (initData && Object.keys(initData).length > 0) {
                    document.getElementById('initDataDisplay').style.display = 'block';
                    document.getElementById('initDataContent').textContent = JSON.stringify(initData, null, 2);

                    // 如果初始化数据包含用户信息,自动填充表单
                    if (initData.userName) {
                        document.getElementById('userName').value = initData.userName;
                    }
                    if (initData.userEmail) {
                        document.getElementById('userEmail').value = initData.userEmail;
                    }
                    if (initData.userPhone) {
                        document.getElementById('userPhone').value = initData.userPhone;
                    }
                }
            } catch (error) {
                console.error('获取初始化数据失败:', error);
            }
        }

        // ==========================================
        // 第四步: 处理表单提交
        // ==========================================
        document.getElementById('userForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!checkSDK()) return;

            // 收集表单数据
            const formData = {
                userName: document.getElementById('userName').value,
                userEmail: document.getElementById('userEmail').value,
                userPhone: document.getElementById('userPhone').value,
                userRemark: document.getElementById('userRemark').value,
                submitTime: new Date().toISOString()
            };

            console.log('📤 提交数据:', formData);
            showStatus('正在提交...', 'info');

            try {
                // 模拟 API 调用(实际项目中替换为真实的 API 请求)
                await simulateAPICall(formData);

                // ==========================================
                // 第五步: 显示成功提示
                // ==========================================
                await window.semApp.cdpSdk.toast('保存成功', {
                    type: 'success',
                    description: '数据已成功保存'
                });

                showStatus('✓ 提交成功!即将关闭弹窗...', 'success');

                // ==========================================
                // 第六步: 关闭弹窗
                // ==========================================
                // 使用 'confirm' 参数会触发父页面刷新数据
                setTimeout(async () => {
                    try {
                        await window.semApp.cdpSdk.closeModal('confirm');
                        console.log('✅ 弹窗已关闭');
                    } catch (error) {
                        console.error('关闭弹窗失败:', error);
                    }
                }, 1000);

            } catch (error) {
                console.error('❌ 提交失败:', error);

                // 显示错误提示
                await window.semApp.cdpSdk.toast('保存失败', {
                    type: 'error',
                    description: error.message || '网络连接超时,请重试'
                });

                showStatus('✕ 提交失败: ' + error.message, 'error');
            }
        });

        // ==========================================
        // 第七步: 处理取消操作
        // ==========================================
        async function handleCancel() {
            if (!checkSDK()) {
                window.close();
                return;
            }

            // 使用 'cancel' 参数不会触发父页面刷新
            try {
                await window.semApp.cdpSdk.closeModal('cancel');
                console.log('✅ 已取消并关闭弹窗');
            } catch (error) {
                console.error('关闭弹窗失败:', error);
            }
        }

        // ==========================================
        // 工具函数
        // ==========================================

        // 显示状态消息
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            statusEl.style.display = 'block';

            if (type === 'info') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            }
        }

        // 模拟 API 调用
        function simulateAPICall(data) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    // 模拟 90% 成功率
                    if (Math.random() > 0.1) {
                        resolve({ success: true, id: Date.now() });
                    } else {
                        reject(new Error('网络连接超时'));
                    }
                }, 1500);
            });
        }

        // ==========================================
        // 页面加载时初始化
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 页面加载完成');
            checkSDK();
            loadInitData();
        });
    </script>
</body>

</html>
