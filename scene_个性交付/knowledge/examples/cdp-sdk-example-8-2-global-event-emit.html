<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP-SDK 示例 8-2：编辑表单发送全局事件</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 28px; background: #fff; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
        form { display: grid; gap: 16px; }
        h1 { margin: 0 0 20px; font-size: 22px; }
        label { display: grid; gap: 6px; color: #475569; font-size: 14px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
        input:focus, select:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        button { border: 0; border-radius: 6px; padding: 10px 18px; color: #fff; background: #2563eb; cursor: pointer; }
        button[type="button"] { background: #64748b; }
        .message { min-height: 22px; color: #b91c1c; font-size: 13px; }
    </style>
</head>

<body>
    <h1>8-2 编辑表单：保存后发送全局事件</h1>

    <form id="editForm">
        <label>
            订单号
            <input id="id" name="id" readonly>
        </label>
        <label>
            客户名称
            <input id="customerName" name="customerName" required>
        </label>
        <label>
            金额
            <input id="amount" name="amount" type="number" min="0" step="0.01" required>
        </label>
        <label>
            状态
            <select id="status" name="status">
                <option>待处理</option>
                <option>处理中</option>
                <option>已完成</option>
            </select>
        </label>
        <div id="message" class="message"></div>
        <div class="actions">
            <button id="cancelButton" type="button">取消</button>
            <button type="submit">保存</button>
        </div>
    </form>

    <script>
        const EVENT_TYPE = 'example:record-saved';

        function getSdk() {
            return window.semApp?.cdpSdk;
        }

        function fillForm() {
            const sdk = getSdk();
            if (!sdk) return;

            // 表格页通过 ui.modal.open({ data }) 传入的记录可通过 getInitData() 获取。
            const data = sdk.getInitData() || {};
            document.getElementById('id').value = data.id || '';
            document.getElementById('customerName').value = data.customerName || '';
            document.getElementById('amount').value = data.amount ?? '';
            document.getElementById('status').value = data.status || '待处理';
        }

        document.getElementById('editForm').addEventListener('submit', async event => {
            event.preventDefault();

            const sdk = getSdk();
            if (!sdk) return;

            const savedRecord = {
                id: document.getElementById('id').value,
                customerName: document.getElementById('customerName').value.trim(),
                amount: Number(document.getElementById('amount').value),
                status: document.getElementById('status').value,
                savedAt: new Date().toISOString()
            };

            if (!savedRecord.id || !savedRecord.customerName || !Number.isFinite(savedRecord.amount)) {
                document.getElementById('message').textContent = '请填写完整的订单信息';
                return;
            }

            try {
                // 这里替换为真实保存接口；只有保存成功后才发送事件。
                await sdk.app.globalEvent.emit(EVENT_TYPE, savedRecord);

                // 关闭当前编辑表单，表格页不依赖返回值，而是通过全局事件刷新。
                await sdk.ui.modal.close({ reason: 'confirm', data: savedRecord });
            } catch (error) {
                console.error('保存订单失败:', error);
                document.getElementById('message').textContent = '保存失败，请重试';
            }
        });

        document.getElementById('cancelButton').addEventListener('click', () => {
            const sdk = getSdk();
            if (sdk) void sdk.ui.modal.close({ reason: 'cancel' });
        });

        window.addEventListener('DOMContentLoaded', fillForm);
    </script>
</body>

</html>
