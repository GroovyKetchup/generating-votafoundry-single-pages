{
  "meta": {
    "name": "个性交付",
    "description": "适用于SemFoundry平台的个性交付场景，主要用于生成HTML单页。",
    "version": "1.0.1",
    "author": "PeiShuo"
  },
  "agent": {
    "model": "gpt-5.1-codex-max",
    "temperature": 0.1,
    "base_prompt": "You are an intelligent assistant. Follow the [Scene Manual] strictly."
  },
  "directories": [
    {
      "path": "knowledge",
      "description": "Core knowledge base and specifications.",
      "scan_strategy": "full_text"
    },
    {
      "path": "script",
      "description": "Executable tools.",
      "scan_strategy": "docstring"
    }
  ],
  "outputConstraints": [
    {
      "path": "index.html",
      "description": "单页的核心代码全部都放到这里"
    }
  ]
}
